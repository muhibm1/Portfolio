<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share-image source (R141, D4, ADR 0005), redesigned 2026-10-27 to the site's current Look (white
  card, peach and lilac glow). Rendered once outside the build, in a local Chromium, to
  public/og.png at exactly 1200 by 630; see docs/hosted-config.md. Fonts resolve from the
  @fontsource files under node_modules, so the render contacts no third-party host.
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Muhammad Muhibullah, Forward Deployed Engineer. I build the agents and fix the process around them.">
  <title>Muhammad Muhibullah, Forward Deployed Engineer</title>
  <foreignObject x="0" y="0" width="1200" height="630">
    <div xmlns="http://www.w3.org/1999/xhtml" class="root">
      <style>
@font-face{font-family:SG;font-weight:500;src:url(../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:600;src:url(../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-600-normal.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:Mono;font-weight:500;src:url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
.root{position:relative;width:1200px;height:630px;overflow:hidden}
.root{background:#fbfbfd;font-family:Plex;color:#424245;position:relative;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;opacity:0.6;background:
 radial-gradient(560px 380px at 96% 2%, rgba(247,190,169,.95), transparent 70%),
 radial-gradient(600px 440px at 76% 110%, rgba(216,195,243,.95), transparent 70%),
 radial-gradient(500px 360px at 6% 112%, rgba(240,236,243,.95), transparent 70%)}
.card{position:absolute;left:44px;top:40px;right:44px;bottom:40px;background:#ffffff;border:1px solid #e3e3e8;
 border-radius:32px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 24px 60px -24px rgba(20,20,40,.18);padding:54px 64px 42px;display:flex;flex-direction:column}
.eyebrow{font-family:Mono;font-weight:500;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#6e6e73}
.name{font-family:SG;font-weight:600;font-size:30px;color:#1d1d1f;margin-top:10px;letter-spacing:-.01em}
h1{font-family:SG;font-weight:500;letter-spacing:-.03em;color:#1d1d1f;line-height:1.02}
.big h1{font-size:74px;margin-top:auto}
.main{display:flex;gap:52px;flex:1;margin-top:30px;align-items:center}
.main h1{font-size:64px;flex:1.2}
.right{flex:.8;display:flex;flex-direction:column;gap:24px;border-left:1px solid #e3e3e8;padding-left:44px}
.v{font-family:SG;font-weight:500;font-size:50px;line-height:1;letter-spacing:-.02em;color:#1d1d1f;white-space:nowrap}
.l{font-size:19px;line-height:1.3;color:#6e6e73;margin-top:6px}
.foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #e3e3e8;padding-top:20px;margin-top:30px}
.foot .who{font-family:Plex;font-size:20px;color:#424245}
.url{font-family:Mono;font-weight:500;font-size:19px;color:#424245}
</style>
      <div class="glow"></div>
      <div class="card big"><div class="eyebrow">Forward deployed engineer</div><div class="name">Muhammad Muhibullah</div><h1>I build the agents and<br/>fix the process around them.</h1><div class="foot"><div class="who">Data Engineer at Apple Maps · Austin, TX</div><div class="url">muhibm1.github.io/Portfolio</div></div></div>
    </div>
  </foreignObject>
</svg>
