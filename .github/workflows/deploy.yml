# Builds, tests and publishes the portfolio to GitHub Pages on every push to main, then checks the
# bytes Pages actually serves. A push to main is a release: nothing reaches Pages unless the pin
# check, lint, tests, the test-count floor, the build and the runtime audit all pass first.
#
# Source of truth: docs/sdlc/2026-09-11-deployed-multi-page-portfolio-on-github-pages/spec.md,
# "Deploy pipeline" (R52, R55 to R64, R80 to R83, R85, R87), and ADRs 0005, 0006 and 0009;
# docs/sdlc/2026-09-13-no-inlined-data-font-urls-in-built-css/spec.md for R97, R99 and R100; and
# docs/sdlc/2026-09-20-pin-node-22-12-minimum/spec.md for R110, R113 and R114.
# docs/sdlc/2026-09-21-serve-every-app-route-with-http-200-on-github-pa/spec.md for R119 to R122,
# and ADR 0003.
# Every action is pinned to a full commit SHA with its release tag in the trailing comment.
# Dependabot proposes SHA updates; read each one before merging, because merging deploys.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Read scopes only. This job installs and runs third-party package code, and none of it needs
    # the ability to publish (R60).
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Package lifecycle scripts run in this job, so the token stays out of .git/config.
          persist-credentials: false

      - name: Set up Node from .nvmrc with the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependency pin check (R85) and .npmrc allowlist (R113)
        run: |
          node -e '
            const fs = require("fs");
            const packageJsonPath = process.argv[1];

            // The nine packages R49 pins to an exact version. The owner extends this list when
            // adding a package.
            const exactPinnedPackages = [
              "react-router",
              "@fontsource/inter",
              "@fontsource/jetbrains-mono",
              "@fontsource/space-grotesk",
              "vitest",
              "@testing-library/react",
              "@testing-library/dom",
              "@testing-library/jest-dom",
              "jsdom",
            ];
            // major.minor.patch with an optional prerelease. A range, tag, URL or git specifier
            // does not match.
            const exactVersion = /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/;

            const manifest = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
            const offenders = [];
            for (const name of exactPinnedPackages) {
              const specifiers = [manifest.dependencies?.[name], manifest.devDependencies?.[name]]
                .filter((specifier) => specifier !== undefined);
              if (specifiers.length === 0) specifiers.push("(not declared)");
              for (const specifier of specifiers) {
                console.log(`${name}: ${specifier}`);
                if (!exactVersion.test(specifier)) offenders.push(`${name} "${specifier}"`);
              }
            }
            if (offenders.length > 0) {
              console.log(`::error::Pin check failed (R85) in ${packageJsonPath}: ${offenders.join(", ")} must be exact versions.`);
              process.exit(1);
            }
            console.log(`Pin check passed: all ${exactPinnedPackages.length} packages are exact versions.`);
          ' package.json
          node scripts/check-npmrc.mjs

      - name: Install dependencies
        run: "npm ci"

      - name: Lint
        run: "npm run lint"

      # The default reporter keeps failing test names in the log; the JSON report feeds the floor.
      - name: Run the tests
        run: "npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json"

      - name: Test-count floors (R52, R11)
        run: "node scripts/check-test-floor.mjs vitest-results.json"

      - name: Build
        run: "npm run build"

      - name: Built CSS inlines no font (R97)
        run: "node scripts/check-built-css-fonts.mjs"

      - name: Every app route has a page (R119)
        run: "node scripts/check-route-pages.mjs"

      - name: Audit runtime dependencies (blocking)
        run: "npm audit --audit-level=high --omit=dev"

      # Shows the dev-only advisories ADR 0009 accepts without blocking the deploy (R57). Any
      # advisory in this log that is not in the ADR 0009 table is new and needs a decision.
      - name: Audit the full dependency tree (informational)
        run: "npm audit --audit-level=high"
        continue-on-error: true

      - name: Read the Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # The owner sets the Pages source to GitHub Actions by hand (R69), so there is nothing to
          # enable. If this step fails on a permission, move it into the deploy job; do not widen
          # this job (spec, "Deploy pipeline").
          enablement: false

      - name: Upload dist as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # This action leaves out dot directories unless told otherwise, which would drop
          # dist/.well-known/security.txt. It still excludes .git and .github.
          include-hidden-files: true

  deploy:
    name: Deploy and smoke-test the published site
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    # The only write scopes in this workflow, and exactly the two a Pages deployment needs (R60).
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The smoke steps assert only the bytes GitHub Pages returns. None of them can tell whether
      # the app mounted in a browser; that is the manual check in docs/hosted-config.md (R84).
      # Each failure prints an error naming the assertion and the URL it fetched (R83).
      - name: "Smoke R63: fetch the published page, retrying for Pages propagation"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          root_url="${PAGE_URL%/}/"
          echo "ROOT_URL=$root_url" >> "$GITHUB_ENV"
          mkdir -p smoke
          status="000"
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then sleep 10; fi
            status=$(curl -sS -o smoke/root.html -w "%{http_code}" "$root_url") || status="000"
            echo "Attempt $attempt of 5: GET $root_url returned $status"
            if [ "$status" = "200" ]; then break; fi
          done
          if [ "$status" != "200" ]; then
            echo "::error::R63 failed: GET $root_url did not return 200 after 5 attempts (last status $status)."
            exit 1
          fi
          echo "Saved the body of $root_url to smoke/root.html:"
          cat smoke/root.html

      - name: "Smoke R87: print the response headers Pages sets (informational, never asserted)"
        run: |
          echo "Response headers for $ROOT_URL. Copy this list into docs/hosted-config.md after the first run."
          curl -sSI "$ROOT_URL" || echo "::warning::R87 could not fetch the headers of $ROOT_URL; nothing is asserted here."

      - name: "Smoke R80: asset paths, the script, the stylesheet and one font"
        run: |
          failures=0
          origin=$(printf '%s' "$ROOT_URL" | sed -E 's#^(https?://[^/]+).*#\1#')

          # Fetches one asset and logs its status and content-type. Prints an error naming the asset
          # and its URL, and returns 1, unless the answer is 200 with a matching content-type.
          fetch_asset() {  # label, url, output file, content-type pattern
            local result status content_type
            result=$(curl -sS -o "$3" -w "%{http_code} %{content_type}" "$2") || result="000 (no response)"
            status=${result%% *}
            content_type=${result#* }
            echo "$1: GET $2 returned $status, content-type $content_type"
            if [ "$status" != "200" ]; then
              echo "::error::R80 failed, $1: GET $2 returned $status, expected 200."
              return 1
            fi
            if ! printf '%s' "$content_type" | grep -qiE "$4"; then
              echo "::error::R80 failed, $1: GET $2 returned content-type $content_type, expected one matching $4."
              return 1
            fi
            echo "PASS R80 $1"
          }

          # Every src= and href= value in the served shell must sit under the Pages base. The sed
          # strips the attribute name and the quotes around the value.
          asset_refs=$(grep -oE "(src|href)=(\"[^\"]*\"|'[^']*')" smoke/root.html | sed -E "s/^(src|href)=.//; s/.\$//" || true)
          if [ -z "$asset_refs" ]; then
            echo "::error::R80 failed: found no src= or href= references in the body of $ROOT_URL."
            exit 1
          fi
          while IFS= read -r asset_ref; do
            case "$asset_ref" in
              /Portfolio/*) echo "PASS R80 asset path $asset_ref begins /Portfolio/" ;;
              *)
                echo "::error::R80 failed: asset path $asset_ref in the body of $ROOT_URL does not begin /Portfolio/."
                failures=$((failures + 1))
                ;;
            esac
          done <<< "$asset_refs"

          module_path=$(grep -oE '<script[^>]*type="module"[^>]*>' smoke/root.html | grep -oE 'src="[^"]*"' | head -n 1 | sed -E 's/^src="//; s/"$//' || true)
          stylesheet_path=$(grep -oE '<link[^>]*rel="stylesheet"[^>]*>' smoke/root.html | grep -oE 'href="[^"]*"' | head -n 1 | sed -E 's/^href="//; s/"$//' || true)
          if [ -z "$module_path" ] || [ -z "$stylesheet_path" ]; then
            echo "::error::R80 failed: the body of $ROOT_URL needs a module script and a stylesheet; found script '$module_path' and stylesheet '$stylesheet_path'."
            exit 1
          fi
          module_url="$origin$module_path"
          echo "MODULE_URL=$module_url" >> "$GITHUB_ENV"
          fetch_asset "module script" "$module_url" smoke/module.js 'javascript' || failures=$((failures + 1))
          fetch_asset "stylesheet" "$origin$stylesheet_path" smoke/stylesheet.css 'text/css' || failures=$((failures + 1))

          # The first .woff2 the stylesheet references. Vite writes these as absolute /Portfolio/ URLs.
          font_path=$(grep -oE 'url\([^)]*\.woff2[^)]*\)' smoke/stylesheet.css | head -n 1 | sed -E 's/^url\(//; s/\)$//' | tr -d "\"'" || true)
          case "$font_path" in
            /Portfolio/*)
              fetch_asset "first woff2 font" "$origin$font_path" smoke/font.woff2 'font|woff2' || failures=$((failures + 1))
              ;;
            *)
              echo "::error::R80 failed: the stylesheet at $origin$stylesheet_path has no .woff2 URL under /Portfolio/ (found '$font_path')."
              failures=$((failures + 1))
              ;;
          esac

          if [ "$failures" -gt 0 ]; then
            echo "R80: $failures assertion(s) failed."
            exit 1
          fi

      # The other copy of the font rule is scripts/check-built-css-fonts.mjs, which the build job
      # runs on dist/ before upload (R97). This one restates it in bash, because the deploy job
      # has no checkout and no Node (ADR 0002). Any edit to the body below re-runs the R104
      # rehearsal of every case before the change is merged.
      - name: "Smoke R100: the served stylesheets inline no font"
        run: |
          failures=0
          face_total=0
          url_total=0
          valid_total=0
          origin=$(printf '%s' "$ROOT_URL" | sed -E 's#^(https?://[^/]+).*#\1#')

          # Recreated so that no file an earlier run left behind is judged. Nothing outside this
          # directory is written, and smoke/root.html is only read.
          rm -rf smoke/r100
          mkdir -p smoke/r100

          match_count=0
          # Writes every match of an extended regular expression, ignoring case, to <output file>
          # and sets match_count. grep exit status 1 means no match, which counts 0; any other
          # status ends the step, because under pipefail a silent grep failure reads as a pass.
          match_into() {  # pattern, input file, output file
            local status=0
            grep -oiE "$1" "$2" > "$3" || status=$?
            if [ "$status" -gt 1 ]; then
              echo "::error::R100 failed: grep exited $status reading $2."
              exit 1
            fi
            match_count=$(wc -l < "$3" | tr -d ' ')
          }

          stylesheet_paths=$(grep -oE '<link[^>]*rel="stylesheet"[^>]*>' smoke/root.html | grep -oE 'href="[^"]*"' | sed -E 's/^href="//; s/"$//' || true)
          if [ -z "$stylesheet_paths" ]; then
            echo "::error::R100 failed: found no stylesheet link in the body of $ROOT_URL."
            exit 1
          fi

          stylesheet_number=0
          while IFS= read -r stylesheet_path; do
            stylesheet_number=$((stylesheet_number + 1))
            stylesheet_url="$origin$stylesheet_path"
            body_file="smoke/r100/stylesheet-$stylesheet_number.css"
            if ! result=$(curl -sS -o "$body_file" -w "%{http_code} %{content_type}" "$stylesheet_url"); then
              result="000 none"
            fi
            status=${result%% *}
            content_type=${result#* }
            if [ -z "$content_type" ]; then content_type="none"; fi
            if [ -s "$body_file" ]; then bytes=$(wc -c < "$body_file" | tr -d ' '); else bytes=0; fi
            echo "R100 stylesheet $stylesheet_number: GET $stylesheet_url returned $status, content-type $content_type, $bytes bytes"

            # Only a stylesheet this step fetched with status 200, a text/css type and a non-empty
            # body is judged. Anything else is a failure, and it never gets a PASS line.
            if [ "$status" != "200" ] || ! grep -qiE 'text/css' <<< "$content_type" || [ "$bytes" -eq 0 ]; then
              echo "::error::R100 failed: GET $stylesheet_url returned $status, content-type $content_type, $bytes bytes; expected 200, text/css and a non-empty body."
              failures=$((failures + 1))
              continue
            fi
            valid_total=$((valid_total + 1))

            # Line breaks count as spaces, so every pattern below reads one flattened line.
            flat_file="smoke/r100/stylesheet-$stylesheet_number.flat"
            faces_file="smoke/r100/stylesheet-$stylesheet_number.faces"
            urls_file="smoke/r100/stylesheet-$stylesheet_number.urls"
            tr '\r\n' '  ' < "$body_file" > "$flat_file"

            match_into 'url\([[:space:]]*["'"'"']?data:font' "$flat_file" "smoke/r100/stylesheet-$stylesheet_number.data"
            data_count=$match_count
            match_into '@font-face[^}]*}' "$flat_file" "$faces_file"
            face_count=$match_count
            match_into 'url\([[:space:]]*["'"'"']?[^)]*' "$faces_file" "$urls_file"
            url_count=$match_count
            face_total=$((face_total + face_count))
            url_total=$((url_total + url_count))

            # A font URL's value is what follows url( after optional whitespace and at most one
            # quote. The /Portfolio/assets/ prefix mirrors the Pages base joined to Vite's assets
            # directory, and it is compared case-sensitively because Pages paths are.
            outside_count=0
            while IFS= read -r font_url; do
              value=$(printf '%s' "$font_url" | sed -E 's/^[uU][rR][lL]\([[:space:]]*["'"'"']?//')
              case "$value" in
                /Portfolio/assets/*) ;;
                *) outside_count=$((outside_count + 1)) ;;
              esac
            done < "$urls_file"

            if [ "$data_count" -eq 0 ] && [ "$outside_count" -eq 0 ]; then
              echo "PASS R100 font URLs are files under /Portfolio/assets/: found 0 data: font and 0 outside at $stylesheet_url"
            else
              echo "::error::R100 failed, font delivery: found $data_count data: font URL(s) and $outside_count @font-face URL(s) outside /Portfolio/assets/, expected 0 and 0, at $stylesheet_url"
              failures=$((failures + 1))
            fi
          done <<< "$stylesheet_paths"

          # A run that scanned a stylesheet and found no font at all has proved nothing.
          if [ "$valid_total" -gt 0 ] && { [ "$face_total" -eq 0 ] || [ "$url_total" -eq 0 ]; }; then
            echo "::error::R100 failed: found $face_total @font-face blocks and $url_total font URLs in the stylesheets linked from $ROOT_URL, expected more than 0 of each."
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "R100: $failures assertion(s) failed."
            exit 1
          fi

      - name: "Smoke R121 and R122: a deep link answers 200 with the root body; an unknown path answers 404"
        run: |
          if [ ! -s smoke/root.html ]; then
            echo "::error::R121 failed: smoke/root.html is empty or missing; nothing to compare against."
            exit 1
          fi
          root_digest=$(sha256sum smoke/root.html | cut -d ' ' -f 1)

          # Follows at most two redirects, so the exact URL a person pastes or shares is what is
          # proved, not only its final destination (ADR 0003). --proto and --proto-redir refuse a
          # downgrade to plain HTTP on the initial request or on any redirect hop. The status,
          # redirect count and effective URL are all printed; the effective URL is also asserted
          # to still be on $ROOT_URL, not printed only.
          result=$(curl -sS -L --proto '=https' --proto-redir '=https' --max-redirs 2 -o smoke/deep-link.html -w "%{http_code} %{num_redirects} %{url_effective}" "${ROOT_URL}work/apple-llm-triage") || {
            echo "::error::R121 failed: could not fetch ${ROOT_URL}work/apple-llm-triage."
            exit 1
          }
          deep_link_status=$(printf '%s' "$result" | cut -d ' ' -f 1)
          deep_link_redirects=$(printf '%s' "$result" | cut -d ' ' -f 2)
          deep_link_effective_url=$(printf '%s' "$result" | cut -d ' ' -f 3-)
          echo "GET ${ROOT_URL}work/apple-llm-triage returned $deep_link_status after $deep_link_redirects redirect(s), effective URL $deep_link_effective_url"
          if [ "$deep_link_status" != "200" ]; then
            echo "::error::R121 failed: GET ${ROOT_URL}work/apple-llm-triage returned $deep_link_status, expected 200 (redirects $deep_link_redirects, effective URL $deep_link_effective_url)."
            exit 1
          fi
          case "$deep_link_effective_url" in
            "${ROOT_URL}"*) ;;
            *)
              echo "::error::R121 failed: effective URL $deep_link_effective_url does not start with $ROOT_URL."
              exit 1
              ;;
          esac
          if [ ! -s smoke/deep-link.html ]; then
            echo "::error::R121 failed: smoke/deep-link.html is empty; nothing to compare against the root body."
            exit 1
          fi
          deep_link_digest=$(sha256sum smoke/deep-link.html | cut -d ' ' -f 1)
          if [ "$root_digest" != "$deep_link_digest" ]; then
            echo "::error::R121 failed: the body of ${ROOT_URL}work/apple-llm-triage differs from the body of $ROOT_URL."
            exit 1
          fi
          echo "PASS R121 ${ROOT_URL}work/apple-llm-triage answers 200 with the root body"

          # No -L here: an unknown path must answer 404 directly, not by redirecting somewhere
          # that then answers 200.
          unknown_status=$(curl -sS -o smoke/unknown.html -w "%{http_code}" "${ROOT_URL}no-such-page") || {
            echo "::error::R122 failed: could not fetch ${ROOT_URL}no-such-page."
            exit 1
          }
          echo "GET ${ROOT_URL}no-such-page returned $unknown_status"
          if [ "$unknown_status" != "404" ]; then
            echo "::error::R122 failed: GET ${ROOT_URL}no-such-page returned $unknown_status, expected 404."
            exit 1
          fi
          if [ ! -s smoke/unknown.html ]; then
            echo "::error::R122 failed: smoke/unknown.html is empty; nothing to compare against the root body."
            exit 1
          fi
          unknown_digest=$(sha256sum smoke/unknown.html | cut -d ' ' -f 1)
          if [ "$root_digest" != "$unknown_digest" ]; then
            echo "::error::R122 failed: the body of ${ROOT_URL}no-such-page differs from the body of $ROOT_URL, so 404.html is missing or stale."
            exit 1
          fi
          echo "PASS R122 ${ROOT_URL}no-such-page answers 404 with the root body"

      - name: "Smoke R82: the served HTML keeps its CSP, referrer policy and privacy removals"
        run: |
          failures=0

          # Prints how many times an extended regular expression matches in a file, ignoring case.
          count_matches() {  # pattern, file
            { grep -oiE "$1" "$2" || true; } | wc -l | tr -d ' '
          }

          # Logs one PASS line, or one error naming the assertion and the URL it checked.
          expect_count() {  # assertion, expected count, actual count, url
            if [ "$3" = "$2" ]; then
              echo "PASS R82 $1: found $3 at $4"
            else
              echo "::error::R82 failed, $1: found $3, expected $2, at $4"
              failures=$((failures + 1))
            fi
          }

          inline_scripts=$({ grep -oiE '<script[^>]*>' smoke/root.html || true; } | { grep -viE '[[:space:]]src=' || true; } | wc -l | tr -d ' ')
          # A generic North American phone pattern, the one src/data/portfolioData.test.js uses.
          # The owner's own digits never appear in this file.
          phone_pattern='\(?[0-9]{3}\)?[[:space:].-]?[0-9]{3}[[:space:].-][0-9]{4}'

          expect_count "exactly one Content-Security-Policy meta tag" 1 "$(count_matches 'http-equiv="Content-Security-Policy"' smoke/root.html)" "$ROOT_URL"
          expect_count 'exactly one name="referrer" meta tag' 1 "$(count_matches 'name="referrer"' smoke/root.html)" "$ROOT_URL"
          expect_count "no inline script without a src attribute" 0 "$inline_scripts" "$ROOT_URL"
          expect_count "no fonts.googleapis.com reference" 0 "$(count_matches 'fonts\.googleapis\.com' smoke/root.html)" "$ROOT_URL"
          expect_count "no fonts.gstatic.com reference" 0 "$(count_matches 'fonts\.gstatic\.com' smoke/root.html)" "$ROOT_URL"
          expect_count "no phone number in the HTML" 0 "$(count_matches "$phone_pattern" smoke/root.html)" "$ROOT_URL"
          expect_count "no phone number in the module script" 0 "$(count_matches "$phone_pattern" smoke/module.js)" "$MODULE_URL"

          if [ "$failures" -gt 0 ]; then
            echo "R82: $failures assertion(s) failed."
            exit 1
          fi
